# Builds the Horu container image for the Raspberry Pi (arm64) and PCs (amd64) and publishes it to GitHub's
# container registry (ghcr.io/<owner>/horu). Run by hand (Actions -> Docker image -> Run workflow) or by pushing a tag v*.
# The first build is long: PyTorch and the text recognition models are downloaded into the image.
name: Docker image

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version from package.json
        id: version
        run: echo "number=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            MODULES=manga,whisper
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
