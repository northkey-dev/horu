name: Idea or wish
description: Something Horu could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation first (what you study, with what), then what is in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: other
    attributes:
      label: How do you do it today, or which tool does it well?
