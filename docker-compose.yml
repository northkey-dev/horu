# Horu with Tailscale: https address for the phone and the Chrome extension, nothing opened to the internet.
# Start it with scripts/pi-install.sh (or: cp .env.example .env, fill in TS_AUTHKEY, docker compose up -d).
name: horu

services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: ${TS_HOSTNAME:-horu}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?Set TS_AUTHKEY in .env (login.tailscale.com -> Settings -> Keys -> Generate auth key)}
      TS_HOSTNAME: ${TS_HOSTNAME:-horu}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - tailscale-state:/var/lib/tailscale
      - tailscale-sock:/var/run/tailscale
      - ./docker/tailscale-serve.json:/config/serve.json:ro
    restart: unless-stopped

  horu:
    image: ghcr.io/northkey-dev/horu:${HORU_VERSION:-latest}
    build:
      context: .
      args:
        MODULES: ${HORU_MODULES:-manga}
    # Same network as the Tailscale container: it passes requests to Horu as local ones.
    network_mode: service:tailscale
    depends_on:
      - tailscale
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      HORU_LAN_ADDRESS: ${HORU_LAN_ADDRESS:-}
      HORU_ANKI_URL: ${HORU_ANKI_URL:-}
      HORU_APP_URL: ${HORU_APP_URL:-}
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
    volumes:
      - ./data:/data
      - tailscale-sock:/var/run/tailscale:ro
    restart: unless-stopped

volumes:
  tailscale-state:
  tailscale-sock:
